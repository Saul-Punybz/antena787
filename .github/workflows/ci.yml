# CI de Antena787. Lo mismo que corre un humano antes de abrir un PR
# (docs/DESARROLLO.md §3), más la compilación cruzada.
#
# Sin builds nocturnas y sin publicar nada: aquí solo se compila y se prueba.
# Un canal al aire no corre código sin versionar.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  verificar:
    name: vet · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "Estos archivos no están formateados. Corre: gofmt -w ."
            echo "$sin_formato"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Con ffmpeg: sin él la mitad de las pruebas se salta y el resto ve
      # la alarma de «no encuentro ffmpeg», que en una máquina real no está.
      - name: ffmpeg
        # Un índice de terceros roto en el runner no es motivo para fallar:
        # con los índices que sí bajaron, ffmpeg se instala igual.
        run: |
          sudo apt-get update -q || sudo apt-get update -q || true
          sudo apt-get install -y -q ffmpeg

      - name: go test
        run: go test ./...

  cruzada:
    name: compilación cruzada
    runs-on: ubuntu-latest
    needs: verificar
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Solo compila: que el binario exista para las tres plataformas desde
      # una sola máquina es la razón por la que se escogió Go, y lo que se
      # rompe el día que alguien mete CGo (ADR 0002).
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  # Corre de verdad en las tres plataformas, con ffmpeg: pruebas de Go y
  # una F0 corta (medios de una quinta parte, 2 min de aire, dos vueltas) cuyo reporte no
  # puede tener ningún FALLA. Es la prueba de "corre en Mac, Linux y
  # Windows" con evidencia, no con compilación cruzada.
  plataformas:
    name: F0 corta en ${{ matrix.os }}
    needs: verificar
    # Si algo se cuelga (pasó en Windows el 9 sept 2026), que falle en
    # minutos y con diagnóstico, no a las seis horas y sin log.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q || sudo apt-get update -q || true
          sudo apt-get install -y -q ffmpeg
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: go test
        run: go test ./...

      - name: compilar f0
        run: go build -o bin/f0${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/f0

      - name: F0 corta
        shell: bash
        run: |
          # macOS no trae «timeout»: un tope portátil con bash.
          con_tope() { local s=$1; shift; "$@" & local p=$!; ( sleep "$s"; kill -9 "$p" 2>/dev/null ) & local w=$!; wait "$p"; local rc=$?; kill "$w" 2>/dev/null; return $rc; }
          ffmpeg -version | head -1
          echo "== f0 media -short =="; con_tope 600 bin/f0 media -short
          echo "== f0 run =="; con_tope 600 bin/f0 run -hours 0.035
          echo "== f0 analyze =="; con_tope 600 bin/f0 analyze
          if grep -q 'FALLA' f0/out/REPORTE.md; then
            echo "El reporte de F0 tiene criterios que FALLAN:"; cat f0/out/REPORTE.md; exit 1
          fi

      # El producto de verdad, arrancado en la plataforma donde va a vivir.
      # Hasta el 12 de septiembre de 2026 esto NO se hacía: el CI compilaba y
      # corría `cmd/f0`, que es el arnés de medición, y `cmd/antena` —lo que
      # se le entrega a una estación— no se construía nunca fuera de un Mac.
      # Un binario que solo compila cruzado no está probado.
      - name: compilar el producto
        run: go build -o bin/antena${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/antena

      - name: el producto arranca y contesta
        shell: bash
        run: |
          set -e
          datos="$(mktemp -d)"
          exe=bin/antena${{ runner.os == 'Windows' && '.exe' || '' }}
          "$exe" -datos "$datos" -escucha 127.0.0.1:7899 > arranque.log 2>&1 &
          pid=$!
          # Hasta 40 s para abrir: un Windows de CI arranca lento y la base
          # se crea y se migra en el primer arranque.
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:7899/api/v1/estado > estado.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "El producto no llegó a contestar. Lo que dijo al arrancar:"; cat arranque.log; exit 1
          fi
          echo "== /estado =="; head -c 400 estado.json; echo
          # Que sea el de verdad y no una página de error: tiene que traer el
          # canal y la versión del esquema puesta al día.
          grep -q '"canal"' estado.json || { echo "la respuesta no trae el canal"; cat arranque.log; exit 1; }
          # Que sirva algo por la raíz. Ojo: este trabajo NO compila la
          # interfaz, así que lo que se sirve aquí es el marcador de reserva,
          # no la interfaz de verdad. Comprobar que va dentro es trabajo del
          # paquete, más abajo, y decirlo aquí evita creer que esto lo cubre.
          curl -fsS --max-time 5 http://127.0.0.1:7899/ > /dev/null || {
            echo "el binario no contesta por la raíz"; exit 1; }
          kill "$pid" 2>/dev/null || true
          echo "el producto arranca y contesta en $(uname -s)"

      # Pase lo que pase, lo último que hizo el motor y qué procesos había:
      # es lo que hace falta para entender un cuelgue en una plataforma
      # que no tenemos a mano.
      - name: diagnóstico
        if: always()
        shell: bash
        run: |
          echo "== medios =="; ls -la f0/media 2>/dev/null || true
          echo "== salida =="; ls -la f0/out 2>/dev/null || true
          echo "== últimos eventos =="; tail -n 15 f0/out/events.jsonl 2>/dev/null || true
          echo "== últimas estadísticas =="; tail -n 8 f0/out/stats.csv 2>/dev/null || true
          echo "== pilas si se colgó =="; cat f0/out/colgado.txt 2>/dev/null || true

      - name: reporte
        if: always()
        shell: bash
        run: cat f0/out/REPORTE.md 2>/dev/null || true

  # La interfaz: tsc y build de Vite. Es lo que el binario embebe.
  interfaz:
    name: interfaz (tsc · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # El paquete que se le manda a una estación: el ejecutable con la interfaz
  # dentro, la guía y el arranque de un clic.
  #
  # Se arma EN Windows, no cruzado desde otro sitio: así lo que se descarga es
  # lo mismo que el CI compiló y arrancó, y no una compilación que nadie probó.
  paquete-windows:
    name: paquete para Windows
    needs: [verificar, interfaz]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: la interfaz, dentro del binario
        shell: bash
        run: |
          npm --prefix web ci
          npm --prefix web run build
          rm -rf internal/api/ui/dist
          cp -R web/dist internal/api/ui/dist

      - name: compilar
        shell: bash
        run: CGO_ENABLED=0 go build -ldflags "-s -w" -o dist/antena.exe ./cmd/antena

      # Que la interfaz vaya DE VERDAD dentro. Un binario sin ella arranca
      # igual y sirve un marcador, y eso se descubre cuando alguien abre el
      # navegador en la torre.
      - name: arranca y sirve la interfaz de verdad
        shell: bash
        run: |
          set -e
          datos="$(mktemp -d)"
          dist/antena.exe -datos "$datos" -escucha 127.0.0.1:7898 > arranque.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:7898/api/v1/estado >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = "1" ] || { echo "no arrancó:"; cat arranque.log; exit 1; }
          raiz=$(curl -fsS --max-time 5 http://127.0.0.1:7898/)
          echo "$raiz" | grep -q 'id="raiz"' || {
            echo "el binario NO lleva la interfaz dentro; esto es lo que sirve:"; echo "$raiz" | head -c 400; exit 1; }
          kill "$pid" 2>/dev/null || true
          echo "arranca en Windows y sirve la interfaz de verdad"

      # ffmpeg va DENTRO del paquete. Antena787 lo busca junto al ejecutable
      # antes que en el PATH, así que con esto la estación no tiene que
      # instalar nada: se descomprime y se abre.
      #
      # Es una compilación estática de gyan.dev, la que recomienda el propio
      # proyecto ffmpeg para Windows. Se guarda su licencia al lado y se deja
      # escrito de dónde salió: ffmpeg es software libre y quien reciba el
      # binario tiene derecho a saber dónde está su código.
      - name: ffmpeg dentro del paquete
        shell: bash
        run: |
          set -e
          url="https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          curl -fsSL "$url" -o ffmpeg.zip
          unzip -q ffmpeg.zip -d ffmpeg-tmp
          bin="$(find ffmpeg-tmp -name ffmpeg.exe -print -quit)"
          [ -n "$bin" ] || { echo "no vino ffmpeg.exe en el paquete"; exit 1; }
          dir="$(dirname "$bin")"
          mkdir -p dist/Antena787-windows
          cp "$dir/ffmpeg.exe" "$dir/ffprobe.exe" dist/Antena787-windows/
          lic="$(find ffmpeg-tmp -iname 'LICENSE*' -print -quit)"
          [ -n "$lic" ] && cp "$lic" dist/Antena787-windows/LICENCIA-ffmpeg.txt
          {
            echo "ffmpeg incluido en este paquete"
            echo
            echo "Compilacion: $url"
            echo "Version:     $("$dir/ffmpeg.exe" -version 2>/dev/null | head -1)"
            echo
            echo "ffmpeg es software libre. Su codigo fuente y las instrucciones"
            echo "para compilarlo estan en https://ffmpeg.org/download.html y en"
            echo "https://www.gyan.dev/ffmpeg/builds/ , que publica las fuentes"
            echo "exactas de cada compilacion. La licencia va en"
            echo "LICENCIA-ffmpeg.txt."
          } > dist/Antena787-windows/SOBRE-ffmpeg.txt
          "$dir/ffmpeg.exe" -version | head -1

      - name: armar el paquete
        shell: bash
        run: |
          mkdir -p dist/Antena787-windows
          cp dist/antena.exe dist/Antena787-windows/
          cp docs/INSTALAR-WINDOWS.md dist/Antena787-windows/LEEME.md
          cp scripts/Arrancar-Antena787.bat dist/Antena787-windows/
          cp LICENSE dist/Antena787-windows/
          echo "== lo que se entrega =="; ls -la dist/Antena787-windows/

      - uses: actions/upload-artifact@v4
        with:
          name: Antena787-windows
          path: dist/Antena787-windows
          retention-days: 30
