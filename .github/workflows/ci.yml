# CI de Antena787. Lo mismo que corre un humano antes de abrir un PR
# (docs/DESARROLLO.md §3), más la compilación cruzada.
#
# Sin builds nocturnas y sin publicar nada: aquí solo se compila y se prueba.
# Un canal al aire no corre código sin versionar.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  verificar:
    name: vet · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "Estos archivos no están formateados. Corre: gofmt -w ."
            echo "$sin_formato"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Con ffmpeg: sin él la mitad de las pruebas se salta y el resto ve
      # la alarma de «no encuentro ffmpeg», que en una máquina real no está.
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: go test
        run: go test ./...

  cruzada:
    name: compilación cruzada
    runs-on: ubuntu-latest
    needs: verificar
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Solo compila: que el binario exista para las tres plataformas desde
      # una sola máquina es la razón por la que se escogió Go, y lo que se
      # rompe el día que alguien mete CGo (ADR 0002).
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  # Corre de verdad en las tres plataformas, con ffmpeg: pruebas de Go y
  # una F0 corta (medios de una quinta parte, 2 min de aire, dos vueltas) cuyo reporte no
  # puede tener ningún FALLA. Es la prueba de "corre en Mac, Linux y
  # Windows" con evidencia, no con compilación cruzada.
  plataformas:
    name: F0 corta en ${{ matrix.os }}
    needs: verificar
    # Si algo se cuelga (pasó en Windows el 9 sept 2026), que falle en
    # minutos y con diagnóstico, no a las seis horas y sin log.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: go test
        run: go test ./...

      - name: compilar f0
        run: go build -o bin/f0${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/f0

      - name: F0 corta
        shell: bash
        run: |
          # macOS no trae «timeout»: un tope portátil con bash.
          con_tope() { local s=$1; shift; "$@" & local p=$!; ( sleep "$s"; kill -9 "$p" 2>/dev/null ) & local w=$!; wait "$p"; local rc=$?; kill "$w" 2>/dev/null; return $rc; }
          ffmpeg -version | head -1
          echo "== f0 media -short =="; con_tope 600 bin/f0 media -short
          echo "== f0 run =="; con_tope 600 bin/f0 run -hours 0.035
          echo "== f0 analyze =="; con_tope 600 bin/f0 analyze
          if grep -q 'FALLA' f0/out/REPORTE.md; then
            echo "El reporte de F0 tiene criterios que FALLAN:"; cat f0/out/REPORTE.md; exit 1
          fi

      # Pase lo que pase, lo último que hizo el motor y qué procesos había:
      # es lo que hace falta para entender un cuelgue en una plataforma
      # que no tenemos a mano.
      - name: diagnóstico
        if: always()
        shell: bash
        run: |
          echo "== medios =="; ls -la f0/media 2>/dev/null || true
          echo "== salida =="; ls -la f0/out 2>/dev/null || true
          echo "== últimos eventos =="; tail -n 15 f0/out/events.jsonl 2>/dev/null || true
          echo "== últimas estadísticas =="; tail -n 8 f0/out/stats.csv 2>/dev/null || true

      - name: reporte
        if: always()
        shell: bash
        run: cat f0/out/REPORTE.md 2>/dev/null || true

  # La interfaz: tsc y build de Vite. Es lo que el binario embebe.
  interfaz:
    name: interfaz (tsc · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
